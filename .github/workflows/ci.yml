# The product targets macOS; Windows remains a compile-only compatibility gate.
# Tests stay headless: no GPU Renderer or EventLoop is constructed.
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: varos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varos
      - name: Fetch crates (the dependency checker's cargo tree needs a resolved graph on a cold cache)
        run: cargo fetch --locked
      - name: Test architecture checker
        run: python -m unittest discover -s ../tools/tests -v
      - name: Enforce dependency directions
        run: python ../tools/check_dep_directions.py
      - name: Check vendored patches (PASS = 0, SKIP = 2 when a pristine archive is not cached, FAIL = 1)
        shell: bash
        run: python ../tools/check_vendor_patches.py || [ $? -eq 2 ]
      - name: Add wasm32 target (varos-text must stay web-buildable, ADR-0012 §1)
        if: runner.os == 'macOS'
        run: rustup target add wasm32-unknown-unknown
      - name: Check varos-text on wasm32
        if: runner.os == 'macOS'
        run: cargo check --locked -p varos-text --target wasm32-unknown-unknown -j 4
      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: Check all targets
        run: cargo clippy --locked --workspace --all-targets -j 4 -- -D warnings
      - name: Test macOS
        if: runner.os == 'macOS'
        run: cargo test --locked --workspace -j 4
      - name: Build macOS
        if: runner.os == 'macOS'
        run: cargo build --locked --workspace -j 4
      - name: Audit dependencies (advisory)
        if: runner.os == 'macOS'
        run: cargo install cargo-audit --locked && cargo audit
        continue-on-error: true
