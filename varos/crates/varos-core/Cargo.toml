[package]
name = "varos-core"
version = "0.1.0"
edition = "2021"

# PURE Rust core: data model + modeless interaction + a render-agnostic scene.
# NO wgpu, NO winit, NO tauri here — that is the hard seam.
# i_overlay = robust polygon boolean (fallback). flo_curves = curve-preserving bezier boolean (primary).
# Both pure-Rust (no FFI), Apache/MIT → GPL-compatible, honor the hard seam.
[dependencies]
i_overlay = "7"
flo_curves = "0.8"
# Serde spine (Foundations Stage-0): the model derives Serialize/Deserialize so the .varos
# document format round-trips. The container (zip) + dialogs live later in the Save system (§4).
serde = { version = "1", features = ["derive"] }
# .vrs (the 🔖 slice) = versioned JSON of the model — the same blob the future PDF container embeds (§4).
serde_json = "1"
# Board tags compare by ONE fold rule (NFC + full case fold, `board::fold`) — the same rule as the app's
# volume-name keys. Pure Rust, already in the workspace lock (varos-app uses it).
unicode-normalization = "0.1.25"

[dev-dependencies]
# SVG parsing/raster validation only; the exporter uses std and the existing core model.
resvg = { version = "0.45", default-features = false }
roxmltree = "0.20"
# Source-model traversal for ADR-0014's no-raster-blob guard (headless, test-only).
syn = { version = "2", features = ["full"] }
