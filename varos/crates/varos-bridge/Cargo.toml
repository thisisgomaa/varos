[package]
name = "varos-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
varos-core = { path = "../varos-core" }
varos-raster = { path = "../varos-raster" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.3"
semver = "1.0"
# ADR-0011 C1: reviewed Ed25519 signatures for host/agent identity proofs (keys from getrandom).
ed25519-dalek = "2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
png = "0.17"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
