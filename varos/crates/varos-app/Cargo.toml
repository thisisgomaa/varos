[package]
name = "varos-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "varos"
path = "src/main.rs"

# The desktop shell (winit) + glue. Later: Tauri drops in here behind the same seam.
[dependencies]
varos-core = { path = "../varos-core" }
varos-render-wgpu = { path = "../varos-render-wgpu" }
varos-pdf = { path = "../varos-pdf" }   # the .vrs PDF container (valid PDF + embedded model)
winit = "0.30.13"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"  # render Lucide SVG cursors to bitmaps
raw-window-handle = "0.6"  # get the HWND for native cursor
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
rfd = "0.15"   # native Save/Open/message dialogs (the 🔖 slice: .vrs on disk)

# ── UI-shell box-system (BOX_SYSTEM_PLAN). egui_tiles is confined to shell/boxtree.rs (ruling 9). ──
egui_tiles = "0.16"                                  # split-tree layout + drag-resize + serde (egui 0.35)
serde = { version = "1", features = ["derive"] }     # BoxState / PanelId serde — workspaces from day one
serde_json = "1"
# Local clock text ("Recovery copy saved at 14:32"). Already in the lock through lopdf with `clock` — no new crate.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Win32 is only compiled on Windows (native cursors, custom frame, single-instance, screen eyedropper).
# Other platforms use the #[cfg(not(windows))] fallbacks — see docs/foundation/MAC_SHELL_PORT.md.
# macOS only: native menu bar and opaque window background (MAC_CHROME.md), plus
# Retina tool cursors whose 32-point NSImage carries 1× and 2× bitmap representations.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSColor", "NSResponder", "NSView", "NSWindow", "NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
