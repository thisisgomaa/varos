[package]
name = "varos-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "varos-cli"
path = "src/main.rs"

[dependencies]
varos-text-layout = { path = "../varos-text-layout" }
varos-import = { path = "../varos-import" }
varos-bridge = { path = "../varos-bridge" }
varos-core = { path = "../varos-core" }
varos-pdf = { path = "../varos-pdf" }
varos-raster = { path = "../varos-raster" }
image = { version = "0.25", default-features = false, features = ["png"] }

serde_json = "1"
