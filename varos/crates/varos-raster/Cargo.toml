[package]
name = "varos-raster"
version = "0.1.0"
edition = "2021"

[dependencies]
varos-text-layout = { path = "../varos-text-layout" }
serde = { version = "1", features = ["derive"] }
varos-core = { path = "../varos-core" }
tiny-skia = "=0.11.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

[dev-dependencies]
lopdf = "0.43"
serde_json = "1"
varos-pdf = { path = "../varos-pdf" }
resvg = "0.45"

