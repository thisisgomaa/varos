[package]
name = "varos-text-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[workspace]

[dependencies]
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "shape-run-cache"] }
skrifa = "=0.42.1"
fontdb = { version = "=0.23.0", default-features = false }
unicode-script = "=0.5.8"
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"
tiny-skia = "=0.11.4"
i_overlay = "=7.0.2"

[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
