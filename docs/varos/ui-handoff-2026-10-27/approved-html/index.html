function download(name,type,data){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSVG(){download('form-studies-'+page().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg','image/svg+xml','<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">'+artworkMarkup({selection:false})+'</svg>');toast('SVG exported')}
function exportMenu(anchor){const m=popover(anchor);menuItem(m,'Export current page as SVG','export',exportSVG);menuItem(m,'Save workspace snapshot','page',()=>{download('varos-workspace.json','application/json',JSON.stringify(state,null,2));toast('Workspace snapshot exported')})}
function resetLayout(){const fresh=layoutBase(state.workspace);Object.assign(state,fresh,{maximized:null});peek=null;save();render();toast('Layout reset · Artwork preserved')}
function layoutMenu(anchor){const m=popover(anchor);menuItem(m,'Reset current layout','rotate',resetLayout);menuItem(m,'Show Properties','properties',()=>openType('properties'));menuItem(m,'Show Layers','layers',()=>openType('layers'));menuItem(m,'Show Color','color',()=>openType('color'));node('div','menu-separator',m);menuItem(m,'Export layout snapshot','export',()=>download('varos-workspace.json','application/json',JSON.stringify(state,null,2)))}
$('#undo').innerHTML=icon('undo');$('#redo').innerHTML=icon('redo');$('#undo').onclick=undo;$('#redo').onclick=redo;$('#export-icon').innerHTML=icon('export');$('#export').onclick=e=>exportMenu(e.currentTarget);$('#layout-menu').innerHTML=icon('splitX');$('#layout-menu').onclick=e=>layoutMenu(e.currentTarget);$('#workspace-menu').innerHTML=icon('chevron');$('#workspace-menu').onclick=e=>{const m=popover(e.currentTarget);for(const name of ['Design','Typography','Board','Focus'])menuItem(m,name,'viewport',()=>switchWorkspace(name),{active:state.workspace===name});node('div','menu-separator',m);menuItem(m,'Reset current layout','rotate',resetLayout)};
$('#pages').onclick=e=>{const m=popover(e.currentTarget);node('div','menu-label',m,'Pages in this document');for(const pg of state.pages)menuItem(m,pg.name,'page',()=>{state.page=pg.id;state.selected=null;save();render()},{active:pg.id===state.page});node('div','menu-separator',m);menuItem(m,'Duplicate current page','copy',()=>act('Duplicated page',()=>{const pg=clone(page());pg.id=uid('page');pg.name+=' copy';state.pages.push(pg);state.page=pg.id;state.selected=null}));menuItem(m,'Add blank page','plus',()=>act('Added page',()=>{const pg={id:uid('page'),name:'Page '+(state.pages.length+1),objects:[],background:'#F0EBDC'};state.pages.push(pg);state.page=pg.id;state.selected=null}))};
$('#help').innerHTML=icon('help');$('#help').onclick=e=>{const m=popover(e.currentTarget);m.style.top='auto';m.style.bottom='35px';m.style.left='auto';m.style.right='12px';node('div','menu-label',m,'Workspace controls');node('div','menu-help',m,'<b>Move panels</b><br>Approach the top edge. Drag the small grip.<br><br><b>Dock</b><br>Drop on any divider for an icon. Drop at an area edge to split it. Drop inside an area to float.<br><br><b>Duplicate</b><br>Hold Alt while dragging. Use the top-left selector to change an editor.<br><br><b>Edit</b><br>Select artwork or a layer. Change fill and geometry in Properties. ⌘Z undoes changes.<br><br><b>Workspaces</b><br>Middle-drag or scroll over the tab row. Escape cancels a panel move.')};
for(const label of ['File','Edit','View','Window','Help'])btn($('.main-menu'),null,label,e=>{const m=popover(e.currentTarget);if(label==='File'){menuItem(m,'Save locally','page',()=>{save();toast('Saved in this browser')},{key:'⌘S'});menuItem(m,'Export SVG','export',exportSVG);menuItem(m,'Save workspace snapshot','export',()=>download('varos-workspace.json','application/json',JSON.stringify(state,null,2)))}if(label==='Edit'){menuItem(m,'Undo','undo',undo,{disabled:!undoStack.length,key:'⌘Z'});menuItem(m,'Redo','redo',redo,{disabled:!redoStack.length,key:'⇧⌘Z'});menuItem(m,'Duplicate','copy',duplicateObject,{disabled:!selected(),key:'⌘D'});menuItem(m,'Delete','trash',deleteObject,{disabled:!selected()||selected()?.locked,key:'⌫'})}if(label==='View'||label==='Window'){for(const [type,[name,ico]]of Object.entries(TYPES))menuItem(m,name,ico,()=>openType(type));node('div','menu-separator',m);menuItem(m,'Reset layout','rotate',resetLayout)}if(label==='Help')node('div','menu-help',m,'An interactive HTML study for Varos. Panel layout, page navigation, layers, solid fills and geometry edits work locally. This is not the full Varos engine. Use the ? button for gestures.')});
const tabs=$('.workspaces');tabs.onpointerdown=e=>{if(e.button===1){e.preventDefault();tabPan={el:tabs,x:e.clientX,scroll:tabs.scrollLeft}}};tabs.addEventListener('wheel',e=>{if(tabs.scrollWidth>tabs.clientWidth){e.preventDefault();tabs.scrollLeft+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY}},{passive:false});
render();window.panelPlayground={snapshot:()=>clone(state),reset:()=>{cleanup();peek=null;closeMenu();undoStack=[];redoStack=[];state=initial();save();render()}};
</script>
</body>
</html>
