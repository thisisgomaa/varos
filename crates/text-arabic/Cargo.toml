[package]
name = "vectorcraft-text-arabic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arabic kashida (tatweel) justification policy for VectorCraft text, from Varos' varos-text"
publish = false

[lints]
workspace = true

[dependencies]
# Only the backend-neutral kashida policy: no second shaper, font stack or font file.
# Path to the Varos worktree for now; to become a pinned git rev once it lands on Varos main.
varos-text = { path = "~/Documents/AI workspace/varos-wt-kashida/varos/crates/varos-text", default-features = false }
unicode-script = "0.5"
