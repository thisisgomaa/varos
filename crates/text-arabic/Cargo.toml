[package]
name = "vectorcraft-text-arabic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arabic kashida (tatweel) justification policy for VectorCraft text, from Varos' varos-text"
publish = false

[lints]
workspace = true

[dependencies]
# Only the backend-neutral kashida policy: no second shaper, font stack or font file.
# Pinned to a Varos main revision over git (see docs/varos/FORK.md).
varos-text = { git = "ssh://git@github.com/thisisgomaa/varos.git", rev = "5936eaf", default-features = false }
unicode-script = "0.5"
